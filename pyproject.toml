[tool.poetry]
name = "headhunter"
version = "0.1.0"
packages = [
    { include = "src" }
]
description = ""
authors = ["Prodeon <prodeon21@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
types-requests = "^2.32.4.20250913"
psycopg2 = "^2.9.11"


[tool.poetry.group.dev.dependencies]
requests = "^2.32.5"
pytest = "^9.0.2"
pytest-cov = "^7.0.0"


[tool.poetry.group.lint.dependencies]
black = "^25.12.0"
flake8 = "^7.3.0"
isort = "^7.0.0"
mypy = "^1.19.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
disallow_untyped_defs=true
warn_return_any=true
exclude="(venv|.venv|env)/"

[tool.black]
line-length=119
exclude="\\.git"

[tool.isort]
line_length=119